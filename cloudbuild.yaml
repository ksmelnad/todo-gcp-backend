substitutions:
  _SERVICE_NAME: backend-staging
  _SUPABASE_URL_SECRET: SUPABASE_URL_STAGING
  _SUPABASE_ANON_KEY_SECRET: SUPABASE_ANON_KEY_STAGING
  _SUPABASE_SVC_KEY_SECRET: SUPABASE_SERVICE_ROLE_KEY_STAGING
  _SUPABASE_JWT_SECRET: SUPABASE_JWT_SECRET_STAGING
  _DATABASE_URL_SECRET: DATABASE_URL_STAGING

steps:
  # Build: no secrets needed at build time for FastAPI
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/backend:$SHORT_SHA
      - .

  # Deploy to Cloud Run (creates service on first run)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/backend:$SHORT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=cloud-run-sa@todo-gcp-498308.iam.gserviceaccount.com
      - --set-secrets=SUPABASE_URL=$_SUPABASE_URL_SECRET:latest,SUPABASE_ANON_KEY=$_SUPABASE_ANON_KEY_SECRET:latest,SUPABASE_SERVICE_ROLE_KEY=$_SUPABASE_SVC_KEY_SECRET:latest,SUPABASE_JWT_SECRET=$_SUPABASE_JWT_SECRET:latest,DATABASE_URL=$_DATABASE_URL_SECRET:latest
      - --project=todo-gcp-498308

images:
  - us-central1-docker.pkg.dev/todo-gcp-498308/todo-app/backend:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
